; PlatformIO project file for the ESP32 E-Stop radio bridge.
; Flash target: any ESP32 dev board wired to the team-provided radio's
; heartbeat/state output and to a LoRa module (SX1276/RFM95, POC-validated
; at ~300ft) for the team-radio <-> robot-radio link.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
	sandeepmistry/LoRa @ ^0.8.0
build_flags =
	-std=gnu++14
	-Wall
